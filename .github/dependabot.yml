# Dependabot keeps the GitHub Actions in .github/workflows/ on their latest releases (D00 T03 §9). Its pull requests
# carry the dependencies label, run CI, and merge by themselves when green, through scripts/merge_prs.py at a
# campaign section boundary or the office-pr-merge task. The C++ toolchain pins move only through their own local
# proposal tasks (D00 T03 §11).
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - dependencies
