name: ci

# Keeps the TODO tree, the generated plan and the tooling tests honest on every push and pull request
# (D00 T01 §3). Windows, because the product and its tooling are Windows only; Python is the newest stable
# CPython, as scripts/check-python-pin.py requires of every interpreter the repository uses.

on:
  push:
  pull_request:
  workflow_dispatch:

# The gates only read the repository.
permissions:
  contents: read

jobs:
  gates:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # validate checks every stamp's commit, so it needs real history, not a shallow clone.
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.15'
          # The newest 3.15 patch, not whatever patch the runner image cached.
          check-latest: true
          # The pinned requirements are restored from the runner cache instead of downloaded on every run.
          cache: pip
          cache-dependency-path: scripts/requirements.txt
      - name: Install the tooling requirements
        run: python -m pip install -r scripts/requirements.txt
      # The pinned build tools (D00 T04 §3). The cache only saves downloads: the key moves with tools.lock.json, and
      # the bootstrap below re-hashes every restored file, so a cache hit is never trusted unchecked.
      - name: Restore the pinned build tools
        uses: actions/cache@v6
        with:
          path: .tools
          key: tools-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools.lock.json') }}
      - name: Install the pinned build tools
        run: python scripts/bootstrap-tools.py
      - name: Check the build tools are installed as pinned
        run: python scripts/bootstrap-tools.py --check
      - name: Show each build tool's version against its pin
        run: python scripts/bootstrap-tools.py --versions
      - name: Check the committed icons match their sources
        run: python scripts/build-icons.py --check
      # The pool is what every push checks; the one-process path is the fallback where no pool can start, and a
      # manual run times it against the pool on the same commit (D01 T02 §8).
      - name: Check the icons drawn in one process (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/build-icons.py --check --jobs 1
      - name: Validate the TODO tree
        run: python scripts/todo-graph.py validate
      - name: Check the generated plan is current
        run: python scripts/todo-graph.py plan --check
      - name: Check the lesson store
        run: python scripts/lessons.py check
      - name: Check every source file states its licence
        run: python scripts/check-spdx.py
      - name: Check the repository is REUSE compliant
        run: python -m reuse lint
      - name: Run the tooling tests
        # One process per test file, several at a time (scripts/run-tests.py); -v keeps every test's name in the log.
        run: python scripts/run-tests.py -v
