# Independent reviewers for this repository, read by scripts/review-dispatch.py.
#
# A route names exactly one reviewer for work written by one agent, never of
# the writer's own model family (the CLI names it: codex is OpenAI, agy is
# Google, claude is Anthropic). A reviewer that is not installed, fails, times
# out, returns nothing or replies OVERALL: blocked is skipped and the reason
# recorded: there is no review, never an approval, and no other reviewer runs.
#
# Loaded strictly: an unknown key, an unknown CLI, a malformed model, a route
# naming an undefined reviewer, a same-family reviewer or more than one
# reviewer refuses every dispatch.

schema_version = 1

# GPT-6 Astra through the Codex CLI, read-only sandbox.
[reviewers.astra]
cli = "codex"
model = "gpt-6-astra"
effort = "medium"

# Sonnet 5.5 through Claude Code in plan mode.
[reviewers.sonnet]
cli = "claude"
model = "claude-sonnet-5-5"
effort = "high"

# Astra reviews wherever it may; Sonnet reviews Codex work (owner decision
# 2026-10-21: one reviewer per writer, no fallback).
[routes]
claude = ["astra"]
codex = ["sonnet"]
gemini = ["astra"]
